setHTML(root, html`<div class="pr-page"><div class="pr-watermark">${t('demo.word')}</div><div class="pr-mast"><div><div class="d">${APP_NAME}</div><div class="dt">${t('demo.word')}</div></div></div><p class="pr-demo-note">${t('demo.print')}</p></div>`);
return;
}
});
window.addEventListener('afterprint', () => setHTML($('#print-root'), ''));
}
function startApp(text) {
loadData(text);
if (!text) loadSampleData({ quiet: true });
renderShell();
initTimelineShell();
initPriorities();
initInbox();
initNotes();
initTrackers();
applyAppearance();
$('#app').addEventListener('click', onAppClick);
document.addEventListener('keydown', onKeyDown);
window.addEventListener('resize', debounce(() => { applyLayout(); requestRender(); Motion.positionInks(false); }, 120));
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', () => applyAppearance());
initSwipe();
initPrintHooks();
window.addEventListener('beforeunload', () => { Timer.logFocus(); if (saveState !== 'saved') saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Timer.logFocus(); saveNow(); } else requestRender(); });
Timer.load();
if (Timer.s) Timer.ensureTick();
Timer.ensureTick();
setInterval(() => {
checkReminders();
if (S.ui.view === 'day' && !TL.drag && !$('.menu, .pop')) { renderTimeline(); renderUpNext(); }
}, 30000);
renderAll();
if (!S.data.meta.tourDone) setTimeout(startTour, 500);
}
function boot() {
const root = document.documentElement;
root.dataset.theme = darkMQ && darkMQ.matches ? 'dark' : 'light';
const stored = readStored();
startApp(stored);
}
Object.defineProperty(window, '__planner', {
value: Object.freeze({
parseQuick: (s, key) => clone(parseQuick(s, { key: key || S.ui.date })),
addDays, diffDays, isoWeek, fmtTime, dkey,
snapshot: () => clone(S.data),
demo: DEMO,
}),
});
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
